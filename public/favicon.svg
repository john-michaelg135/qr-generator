<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" rx="6" fill="#0A0A0F"/>
  <!-- QR-style grid pattern -->
  <rect x="4" y="4" width="8" height="8" rx="1" fill="#33E1FF"/>
  <rect x="20" y="4" width="8" height="8" rx="1" fill="#33E1FF"/>
  <rect x="4" y="20" width="8" height="8" rx="1" fill="#33E1FF"/>
  <!-- Inner squares -->
  <rect x="6" y="6" width="4" height="4" fill="#0A0A0F"/>
  <rect x="22" y="6" width="4" height="4" fill="#0A0A0F"/>
  <rect x="6" y="22" width="4" height="4" fill="#0A0A0F"/>
  <!-- Center dot -->
  <rect x="7" y="7" width="2" height="2" fill="#33E1FF"/>
  <rect x="23" y="7" width="2" height="2" fill="#33E1FF"/>
  <rect x="7" y="23" width="2" height="2" fill="#33E1FF"/>
  <!-- Data modules -->
  <rect x="14" y="4" width="3" height="3" fill="#33E1FF" opacity="0.8"/>
  <rect x="14" y="14" width="4" height="4" rx="1" fill="#33E1FF"/>
  <rect x="20" y="14" width="3" height="3" fill="#33E1FF" opacity="0.7"/>
  <rect x="14" y="20" width="3" height="3" fill="#33E1FF" opacity="0.6"/>
  <rect x="20" y="20" width="4" height="4" fill="#33E1FF" opacity="0.5"/>
  <rect x="4" y="14" width="3" height="3" fill="#33E1FF" opacity="0.7"/>
  <!-- Glow effect -->
  <rect x="4" y="4" width="8" height="8" rx="1" fill="none" stroke="#33E1FF" stroke-width="0.5" opacity="0.4"/>
  <rect x="20" y="4" width="8" height="8" rx="1" fill="none" stroke="#33E1FF" stroke-width="0.5" opacity="0.4"/>
  <rect x="4" y="20" width="8" height="8" rx="1" fill="none" stroke="#33E1FF" stroke-width="0.5" opacity="0.4"/>
</svg>
